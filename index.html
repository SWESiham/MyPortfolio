<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siham Said | Full-Stack Developer</title>
<meta name="description" content="Siham Said, full-stack developer building MERN stack web apps with MongoDB, Express, React and Node.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,300..500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Colors: change them here. Dark mode values are in [data-theme=dark] */
:root{--bg:#F5F5FA;--ink:#14122B;--muted:#5A5775;--card:#fff;--line:#E3E1EF;
--c1:#4A35B5;--c2:#6F5BD9;--c3:#A9772B;--c4:#1F8A87;--c5:#8FD9BF;
--head:"Fraunces","IBM Plex Sans Arabic",Georgia,serif;--body:"Manrope","IBM Plex Sans Arabic","Segoe UI",sans-serif}
[data-theme=dark]{--bg:#0C0B1A;--ink:#EEEDF8;--muted:#A5A2C2;--card:#15142B;--line:#26244A;--c1:#8F7CF7;--c2:#6B57E3;--c3:#E4C48B;--c4:#6FD6CF;--c5:#8FD9BF}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 var(--body);overflow-x:hidden;transition:background .4s,color .4s}
body.lock{overflow:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--c2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ===== Loader: the name rises letter by letter, a gold line draws, the curtain lifts ===== */
#loader{position:fixed;inset:0;z-index:99;display:grid;place-items:center;direction:ltr;background:radial-gradient(circle at 50% 45%,#1d1846,#0A0918 70%);transition:transform 1s cubic-bezier(.77,0,.18,1)}
#loader.open{transform:translateY(-101%)}
.ld{text-align:center;color:#EEEDF8;transition:opacity .5s}
#loader.open .ld{opacity:0}
.nm{font:italic 400 clamp(3.2rem,14vw,8.5rem)/1.05 "Fraunces",Georgia,serif;letter-spacing:-.01em}
.nm span{display:inline-block;opacity:0;transform:translateY(45%);filter:blur(12px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 70ms + 150ms)}
.nm .sp{width:.3em}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.rule{height:1px;width:min(280px,55vw);margin:20px auto 16px;background:linear-gradient(90deg,transparent,#E4C48B,transparent);transform:scaleX(0);animation:draw 1s .9s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{transform:none}}
.ar{font:400 clamp(1.7rem,5vw,2.6rem) "Aref Ruqaa",serif;color:#E4C48B;opacity:0;animation:fade .8s 1.2s forwards}
@keyframes fade{to{opacity:1}}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:68px;gap:12px}
.logo{font:800 1.25rem var(--head);transition:transform .3s}.logo:hover{transform:rotate(-4deg) scale(1.06)}
#links{position:relative;display:flex;gap:2px;list-style:none;font-weight:600}
#links a{position:relative;z-index:1;display:block;padding:8px 15px;border-radius:999px;text-decoration:none;transition:color .3s}
#links a.on{color:#fff}
#links a:not(.on):hover{color:var(--c2)}
.pill{position:absolute;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2));opacity:0;transition:left .45s cubic-bezier(.3,1.4,.5,1),width .45s,top .3s,opacity .3s}
.tools{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:none;color:var(--ink);font:700 1.05rem var(--head);cursor:pointer;transition:transform .3s,background .3s}
.ic:hover{background:var(--c3);color:#1A0F3D;border-color:var(--c3);transform:rotate(20deg) scale(1.1)}

.hero{position:relative;padding:50px 0 30px;overflow-x:clip}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;animation:drift 12s ease-in-out infinite alternate}
.orb.a{width:320px;height:320px;background:var(--c1);top:-40px;inset-inline-start:-80px}
.orb.b{width:280px;height:280px;background:var(--c2);top:120px;inset-inline-end:-60px;animation-delay:-4s}
.orb.c{width:220px;height:220px;background:var(--c4);bottom:0;inset-inline-start:40%;animation-delay:-8s}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.2)}}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center}
.hello{color:var(--muted);font-weight:600;margin-bottom:8px}
h1{font:800 clamp(2.6rem,8vw,5.6rem)/1.05 var(--head);letter-spacing:-.02em}
.role{margin-top:20px;font:600 clamp(1.1rem,2.4vw,1.5rem) var(--head);color:var(--muted);min-height:2em}
#typed{color:var(--ink);border-inline-end:3px solid var(--c2);padding-inline-end:4px}
.lead{margin-top:10px;max-width:46ch;color:var(--muted)}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font:700 1rem var(--body);text-decoration:none;border:2px solid var(--ink);transition:transform .2s,background .2s,color .2s;cursor:pointer;background:none;color:var(--ink)}
.btn.main{background:linear-gradient(90deg,var(--c1),var(--c2));border-color:transparent;color:#fff}
.btn:hover{transform:translateY(-3px);background:var(--c3);border-color:var(--c3);color:#1A0F3D}
.code{direction:ltr;text-align:left;background:#1B1038;color:#e9e5ff;border-radius:20px;padding:22px 24px;font:500 .95rem/1.7 Consolas,"Courier New",monospace;box-shadow:10px 10px 0 var(--c3);animation:float 5s ease-in-out infinite}
.code .dots{display:flex;gap:7px;margin-bottom:12px}.code .dots i{width:11px;height:11px;border-radius:50%;background:var(--c2)}.code .dots i:nth-child(2){background:var(--c3)}.code .dots i:nth-child(3){background:var(--c5)}
.k{color:#ff8fb0}.s{color:#7fe3d5}.n{color:#ffd166}
@keyframes float{50%{transform:translateY(-10px)}}

.rows{direction:ltr;margin:44px 0 6px;display:grid;gap:6px;transform:rotate(-2deg);width:110%;margin-left:-5%}
.row{display:flex;width:max-content;white-space:nowrap;will-change:transform;font:800 clamp(2.6rem,7vw,5.2rem)/1.1 var(--head);letter-spacing:-.02em}
.row span{padding-right:.5em}
.row.out span{color:transparent;-webkit-text-stroke:2px var(--ink)}
.row.fill span{color:var(--c2)}.row.fill span:nth-child(3n+2){color:var(--c4)}.row.fill span:nth-child(3n){color:var(--c3)}

section{padding:76px 0}
h2{font:800 clamp(1.8rem,4vw,2.6rem)/1.15 var(--head);letter-spacing:-.01em;margin-bottom:10px}
.sub{color:var(--muted);max-width:56ch;margin-bottom:30px}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:start}
.about p+p{margin-top:14px}
.facts{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:14px}
.facts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.facts div:last-child{border:0;padding:0}.facts span{color:var(--muted)}.facts b{text-align:end}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.stat{border-radius:22px;padding:24px;color:#fff;font-weight:600;transition:transform .3s}
.stat:hover{transform:translateY(-6px) rotate(-1deg)}
.stat b{display:block;font:800 clamp(2.4rem,6vw,3.6rem)/1 var(--head)}
.stat:nth-child(1){background:var(--c1)}.stat:nth-child(2){background:var(--c2)}.stat:nth-child(3){background:var(--c3);color:#1A0F3D}

.serv{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sv{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px;border-top:8px solid var(--c1);transition:transform .3s}
.sv:nth-child(2){border-top-color:var(--c2)}.sv:nth-child(3){border-top-color:var(--c4)}
.sv:hover{transform:translateY(-8px)}
.sv h3{font:700 1.3rem var(--head);margin-bottom:8px}.sv p{color:var(--muted)}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tab{padding:9px 20px;border-radius:999px;border:2px solid var(--ink);background:none;font:600 1rem var(--body);cursor:pointer;color:var(--ink);transition:transform .2s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:12px;min-height:130px;align-content:flex-start}
.chips li{list-style:none;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 22px;font:700 1.05rem var(--head);animation:pop .35s both}
.chips li:nth-child(3n+1){border-color:var(--c1)}.chips li:nth-child(3n+2){border-color:var(--c2)}.chips li:nth-child(3n){border-color:var(--c4)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* ===== Experience: a thread fills as you scroll; each role branches off it and unfolds ===== */
#experience{overflow-x:clip}
.xp{position:relative;margin-top:28px}
.spine{position:absolute;top:0;bottom:0;inset-inline-start:50%;width:4px;margin-inline-start:-2px;border-radius:4px;background:var(--line)}
.spine i{position:absolute;left:0;right:0;top:0;height:var(--h,0%);border-radius:4px;background:linear-gradient(var(--c1),var(--c2),var(--c3))}
.spine b{position:absolute;z-index:2;left:50%;top:var(--h,0%);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--c3);box-shadow:0 0 0 6px color-mix(in srgb,var(--c3) 30%,transparent),0 0 26px var(--c3)}
.xi{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-bottom:60px;--s:1}
.xi:last-child{margin-bottom:0}
.xi:nth-child(odd){--dx:-80px;--r:-2deg}.xi:nth-child(even){--dx:80px;--r:2deg}
[dir=rtl] .xi{--s:-1}
.xn{position:absolute;z-index:1;top:30px;inset-inline-start:50%;width:24px;height:24px;margin-inline-start:-12px;border-radius:50%;background:var(--bg);border:4px solid var(--line);transition:background .4s,border-color .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.xi.in .xn{background:var(--k);border-color:var(--bg);box-shadow:0 0 0 3px var(--k);transform:scale(1.15);animation:ping .9s}
@keyframes ping{0%{box-shadow:0 0 0 3px var(--k),0 0 0 3px color-mix(in srgb,var(--k) 55%,transparent)}100%{box-shadow:0 0 0 3px var(--k),0 0 0 22px transparent}}
.xl{position:absolute;top:40px;height:4px;width:0;border-radius:4px;background:var(--k);transition:width .5s .1s cubic-bezier(.3,.9,.3,1)}
.xi:nth-child(odd) .xl{inset-inline-end:50%}.xi:nth-child(even) .xl{inset-inline-start:50%}
.xi.in .xl{width:48px}
.xi:nth-child(odd) .xc{grid-column:1;margin-inline-end:48px}
.xi:nth-child(even) .xc{grid-column:2;margin-inline-start:48px}
.xc{position:relative;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--k);border-radius:24px;padding:24px 26px 26px;opacity:0;
  transform:translateX(calc(var(--dx) * var(--s))) rotate(calc(var(--r) * var(--s))) scale(.94);
  transition:opacity .7s .15s,transform .9s .15s cubic-bezier(.2,.9,.25,1.12),box-shadow .35s}
.xi.in .xc{opacity:1;transform:none}
.xi.in .xc:hover{box-shadow:10px 10px 0 var(--k)}
.xh{display:flex;gap:14px;align-items:center}
.lg{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--k);color:var(--kt,#fff);font:800 .95rem var(--head);letter-spacing:.02em}
.xh h3{font:700 1.3rem/1.25 var(--head)}
.org{color:var(--muted);font-weight:600;line-height:1.4}.org b{color:var(--ink)}.org span{display:block;font-weight:500;font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 12px;color:var(--muted);font-weight:600;font-size:.95rem}
.when{background:var(--bg);border-radius:999px;padding:3px 13px;color:var(--ink)}
.badge.now{margin:0;display:inline-flex;align-items:center;gap:7px}
.badge.now i{width:8px;height:8px;border-radius:50%;background:#06281d;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.xc ul{list-style:none;display:grid;gap:8px}
.xc li{position:relative;padding-inline-start:20px;color:var(--muted)}
.xc li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--k)}
.xc .tg{margin-top:16px}
.xc li,.xc .tg span{opacity:0;transform:translateY(10px)}
.xi.in .xc li,.xi.in .xc .tg span{opacity:1;transform:none;transition:opacity .5s,transform .5s;transition-delay:calc(.45s + var(--j) * .1s)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:10px 10px 0 var(--c2)}
.thumb{aspect-ratio:5/3;overflow:hidden;background:var(--line)}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .thumb>*{transform:scale(1.07)}
.cb{padding:22px;display:grid;gap:10px;flex:1;align-content:start}
.cb h3{font:700 1.4rem var(--head)}
.cb p{color:var(--muted)}
.badge{display:inline-block;background:var(--c5);color:#06281d;border-radius:999px;font:700 .8rem var(--body);padding:2px 12px;margin-inline-start:8px;vertical-align:middle}
.tg{display:flex;flex-wrap:wrap;gap:8px}.tg span{background:var(--bg);border-radius:999px;padding:3px 13px;font-weight:600;font-size:.9rem}
.go{font-weight:700;color:var(--c2)}

.contact{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:32px;padding:56px 40px;text-align:center;position:relative;overflow:hidden}
.contact p{max-width:46ch;margin:0 auto;opacity:.92}
form{display:grid;gap:14px;max-width:560px;margin:26px auto 0}
input,textarea{width:100%;padding:14px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;font:inherit}
input::placeholder,textarea::placeholder{color:#fff;opacity:.75}
textarea{min-height:130px;resize:vertical}
.contact .btn{border-color:#fff;color:#fff}.contact .btn.main{background:#fff;color:var(--c1);border-color:#fff}
.contact .btn:hover{background:var(--c3);border-color:var(--c3);color:#1A0F3D}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
footer{padding:28px 0 40px;text-align:center;color:var(--muted);font-size:.95rem}

#education{padding:28px 0 8px}
.edu{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 34px}
.cap{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1)}.cap svg{width:40px;height:40px}
.eh{margin:0;font:600 clamp(1.4rem,3vw,2rem)/1.2 var(--head)}.eu{color:var(--muted);font-weight:600}
.ef{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--line);padding-top:20px}
.ef span{display:block;color:var(--muted);font-size:.92rem}.ef b{font:600 1.15rem var(--head)}
.hero .wrap.mw{display:block;margin-top:54px}
.mern{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.mt{padding:22px 20px 6px;border-inline-end:1px solid var(--line)}.mt:last-child{border:0}
.mt b{display:block;font:600 clamp(3rem,8vw,5.2rem)/1 var(--head);color:var(--c1);transition:color .3s,transform .3s}
.mt:hover b{color:var(--c3);transform:translateY(-4px)}
.mt h3{font:700 1.1rem var(--head);margin-top:6px}.mt p{color:var(--muted);font-size:.95rem}
.sv:nth-child(n){border:1px solid var(--line);padding:28px}
.sv:hover{border-color:var(--c1)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1);margin-bottom:16px}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lgs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lng{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;transition:transform .3s,border-color .3s}
.lng:hover{transform:translateY(-5px);border-color:var(--t)}
.mono{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:700 1.2rem Consolas,"Courier New",monospace;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent);direction:ltr}
.lng h3{font:700 1.25rem var(--head)}.lng p{color:var(--muted);font-size:.97rem}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:44px;padding-top:30px;border-top:1px solid var(--line)}
.sg h3{font:700 1.05rem var(--head);margin-bottom:12px;color:var(--muted)}
.sg ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.sg li{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:600}
h1,h2{font-weight:600}h1{letter-spacing:-.025em}
.orb{opacity:.28}
.code{box-shadow:0 28px 60px -24px rgba(20,18,43,.5)}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -26px rgba(20,18,43,.45)}
.xi.in .xc:hover{box-shadow:0 26px 50px -26px rgba(20,18,43,.45)}
.facts,.card{border-width:1px}
.contact{background:linear-gradient(135deg,#1B1744,#2E2570)}.contact .btn.main{color:#2E2570}
[data-theme=dark] .btn.main{color:#fff}[data-theme=dark] .lg{color:#120E26!important}
@media(max-width:800px){
  .hero .wrap,.about,.serv,.grid,.stats{grid-template-columns:1fr}
  #links{overflow-x:auto;max-width:56vw}#links a{padding:8px 11px;font-size:.92rem}
  .logo{display:none}.contact{padding:40px 22px}
  .spine{inset-inline-start:15px}
  .xi{grid-template-columns:1fr;margin-bottom:44px}
  .xi:nth-child(n){--dx:60px}
  .xi:nth-child(n) .xc{grid-column:1;margin-inline:44px 0}
  .xn{inset-inline-start:15px}
  .xi:nth-child(n) .xl{inset-inline:15px auto}
  .xi.in .xl{width:29px}
  .edu{grid-template-columns:1fr;padding:24px}.ef,.mern,.lgs,.stk{grid-template-columns:1fr 1fr}.mt:nth-child(2n){border-inline-end:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.code,.chips li,.orb{animation:none}.curtain,.pill{transition:none}.xc,.xc li,.xc .tg span,.xl,.xn{transition:none!important;animation:none!important}.badge.now i{animation:none}}
</style>
</head>
<body class="lock">

<div id="loader" aria-label="Loading"><div class="ld"><div class="nm" id="nm" aria-label="Siham Said"></div><div class="rule"></div><div class="ar">سهام سيد</div></div></div>

<nav><div class="wrap">
  <b class="logo" data-i="name"></b>
  <ul id="links">
    <li class="pill" id="pill" aria-hidden="true"></li>
    <li><a href="#about" data-i="nAbout"></a></li><li><a href="#services" data-i="nServ"></a></li>
    <li><a href="#skills" data-i="nSkills"></a></li><li><a href="#experience" data-i="nExp"></a></li>
    <li><a href="#work" data-i="nWork"></a></li><li><a href="#contact" data-i="nContact"></a></li>
  </ul>
  <div class="tools">
    <button class="ic" id="langBtn" aria-label="Language">ع</button>
    <button class="ic" id="themeBtn" aria-label="Dark or light mode">☾</button>
  </div>
</div></nav>

<header class="hero">
<i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
<div class="wrap">
  <div>
    <p class="hello" data-i="hello"></p>
    <h1 data-i="name"></h1>
    <p class="role"><span data-i="build"></span> <span id="typed"></span></p>
    <p class="lead" data-i="lead"></p>
    <div class="cta">
      <a class="btn main" href="#work" data-i="btnWork"></a>
      <!-- CV is hosted on Google Drive (the file must be shared as "Anyone with the link") -->
      <a class="btn" href="https://drive.google.com/uc?export=download&id=1-1C2U6r8n7R0uB_iniPCSJE1eSu87aEG" target="_blank" rel="noopener" data-i="btnCv"></a>
      <a class="btn" href="#contact" data-i="btnTalk"></a>
    </div>

  $("langs").innerHTML = LANGS.map(l => `<div class="lng" style="--t:var(${l.c})"><span class="mono">${l.k}</span><h3>${l.n}</h3><p>${l.d[lang]}</p></div>`).join("");

  $("mern").innerHTML = MERN.map(m => `<div class="mt"><b>${m.k}</b><h3>${m.n}</h3><p>${m.d[lang]}</p></div>`).join("");
}
function render(){
  const h = document.documentElement;
  h.dataset.theme = theme; h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
  $("themeBtn").textContent = theme === "dark" ? "☀" : "☾";
  $("langBtn").textContent = lang === "ar" ? "EN" : "ع";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T[lang][el.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = T[lang][el.dataset.ph]);
  $("facts").innerHTML = FACTS.map(f => `<div><span>${f[0][lang]}</span><b>${f[1][lang]}</b></div>`).join("");

  renderXp();
  renderSkills(); renderProjects();

}

/* ---- Navigation pill: slides to the section you are reading ---- */
const links = [...document.querySelectorAll("#links a")];
function setPill(a){
  const p = $("pill");
  links.forEach(l => l.classList.toggle("on", l === a));
  if (!a) { p.style.opacity = 0; return; }
  Object.assign(p.style, {opacity:1, width:a.offsetWidth+"px", height:a.offsetHeight+"px", left:a.offsetLeft+"px", top:a.offsetTop+"px"});
}
function spy(){
  let cur = null;
  links.forEach(l => { const s = document.querySelector(l.getAttribute("href")); if (s.getBoundingClientRect().top < innerHeight * .4) cur = l; });
  if (cur !== active) { active = cur; setPill(cur); }
}
addEventListener("scroll", spy, {passive:true}); addEventListener("resize", () => setPill(active));



/* ---- Typing line ---- */
function type(){
  const w = ROLES[lang][ri];
  if (reduce) { $("typed").textContent = ROLES[lang][0]; return setTimeout(type, 1000); }
  $("typed").textContent = w.slice(0, ci);
  if (!del && ci === w.length) { del = true; return setTimeout(type, 1400); }
  if (del && ci === 0) { del = false; ri = (ri + 1) % ROLES[lang].length; }
  ci += del ? -1 : 1;
  setTimeout(type, del ? 35 : 75);
}
